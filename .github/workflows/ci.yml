name: cbc-event-ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip coverage
      - run: python -m unittest discover -s tests -v
      - run: python -m coverage run --branch --source=cbc_event -m unittest discover -s tests
      - run: python -m coverage report --fail-under=90
      - run: python -m coverage json -o coverage.json
