name: cbc-event-ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip coverage
      - run: python -m unittest discover -s tests -v
      # Repo test coverage only; this is not a CBC release gate.
      - run: python -m coverage erase
        env:
          COVERAGE_FILE: .coverage.protocol
      - run: python -m coverage run --branch --source=./cbc_event -m unittest discover -s tests
        env:
          COVERAGE_FILE: .coverage.protocol
      - run: python -m coverage report --fail-under=90
        env:
          COVERAGE_FILE: .coverage.protocol
      - run: python -m coverage json -o coverage.json
        env:
          COVERAGE_FILE: .coverage.protocol
      - run: python -m coverage erase
        env:
          COVERAGE_FILE: .coverage.viewer
      - run: python -m coverage run --branch --source=./cbc_viewer -m unittest discover -s tests
        env:
          COVERAGE_FILE: .coverage.viewer
      - run: python -m coverage report --fail-under=90
        env:
          COVERAGE_FILE: .coverage.viewer
