[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbc-event"
version = "0.2.0rc1"
description = "Append-only event protocol and zero-dependency client for the CB ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8.0", "coverage>=7.6"]
# The viewer is stdlib-only.  This extra exists so installs can state the
# intent explicitly; it deliberately pulls no third-party runtime dependency.
viewer = []

[project.scripts]
cbc-viewer = "cbc_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cbc_event*", "cbc_viewer*"]
