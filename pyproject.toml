[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbc-event"
version = "0.1.0"
description = "Append-only event protocol and zero-dependency client for the CB ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8.0", "coverage>=7.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cbc_event*"]
